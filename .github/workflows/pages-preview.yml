name: Deploy SpoodleSpace UI preview

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-preview
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the triggering main commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 16.20.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build preview
        env:
          PUBLIC_URL: /spoodle-space-pp5
          REACT_APP_PAGES_PREVIEW: "true"
          CI: "true"
        run: |
          npm run build
          for route in search posts/create my-dog profile signin signup; do
            mkdir -p "build/$route"
            cp build/index.html "build/$route/index.html"
          done
          cp build/index.html build/404.html
          printf '{"commit":"%s"}\n' "$(git rev-parse HEAD)" > build/preview-version.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
