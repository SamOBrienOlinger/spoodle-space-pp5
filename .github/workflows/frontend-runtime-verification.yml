name: Frontend build and visual verification

on:
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 25

    steps:
      - name: Check out pull-request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Use project Node version
        uses: actions/setup-node@v4
        with:
          node-version: 16.20.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Create full production build
        env:
          PUBLIC_URL: /spoodle-space-pp5
          CI: true
        run: npm run build

      - name: Install browser verification tooling
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.40.1
          npx playwright install --with-deps chromium webkit

      - name: Prepare browser verification output
        run: mkdir -p verification-artifacts

      - name: Start production build
        run: |
          node scripts/serve-preview.cjs > verification-artifacts/server.log 2>&1 &
          echo $! > verification-artifacts/server.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/spoodle-space-pp5/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat verification-artifacts/server.log
          exit 1

      - name: Run desktop and mobile browser checks
        run: |
          cat > /tmp/verify-spoodlespace.js <<'EOF'
          const { chromium, webkit } = require('playwright');
          const fs = require('fs');

          const baseUrl = 'http://127.0.0.1:4173/spoodle-space-pp5/';
          const outputDir = 'verification-artifacts';
          const results = [];
          const browserErrors = [];

          async function verifyViewport(browser, name, viewport) {
            const page = await browser.newPage({ viewport });
            const pageErrors = [];
            const consoleErrors = [];
            const failedRequests = [];

            page.on('pageerror', error => pageErrors.push(error.message));
            page.on('console', message => {
              if (message.type() === 'error') consoleErrors.push(message.text());
            });
            page.on('requestfailed', request => {
              failedRequests.push({
                url: request.url(),
                error: request.failure()?.errorText || 'unknown failure'
              });
            });

            // Use local fixtures so signed-in controls can be reviewed without live accounts.
            const avatar = 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80"><rect width="80" height="80" rx="40" fill="#d9c4ed"/><circle cx="40" cy="30" r="14" fill="#7040b7"/><path d="M15 72a25 25 0 0 1 50 0" fill="#7040b7"/></svg>');
            await page.route('**/api/**', async route => {
              const pathname = new URL(route.request().url()).pathname;
              let body = { count: 0, next: null, previous: null, results: [] };
              if (pathname.endsWith('/dj-rest-auth/user/')) {
                body = { pk: 1, username: 'preview', profile_id: 1, profile_image: avatar };
              } else if (pathname.includes('/profiles/')) {
                body = { count: 3, next: null, previous: null, results: [
                  { id: 2, owner: 'River', image: avatar, following_id: 12 },
                  { id: 3, owner: 'Skye', image: avatar, following_id: 13 },
                  { id: 4, owner: 'Moss', image: avatar, following_id: null }
                ] };
              }
              await route.fulfill({ status: 200, contentType: 'application/json', body: JSON.stringify(body) });
            });

            const response = await page.goto(baseUrl, {
              waitUntil: 'domcontentloaded',
              timeout: 60000
            });
            await page.waitForTimeout(6000);

            const metrics = await page.evaluate(() => {
              const root = document.getElementById('root');
              const logo = document.querySelector('img[alt="SpoodleSpace"]');
              const bodyText = document.body.innerText.trim();
              return {
                title: document.title,
                bodyTextLength: bodyText.length,
                bodyTextPreview: bodyText.slice(0, 500),
                rootChildCount: root ? root.childElementCount : 0,
                logoVisible: Boolean(logo && logo.getBoundingClientRect().width > 0),
                horizontalOverflow: document.documentElement.scrollWidth - window.innerWidth,
                viewportWidth: window.innerWidth,
                documentWidth: document.documentElement.scrollWidth
              };
            });

            await page.screenshot({
              path: `${outputDir}/${name}-feed.png`,
              fullPage: true
            });

            if (name.endsWith('mobile')) {
              const toggle = page.locator('.navbar-toggler');
              if (await toggle.count()) {
                await toggle.click();
                await page.waitForTimeout(500);
                await page.screenshot({
                  path: `${outputDir}/${name}-menu.png`,
                  fullPage: true
                });
              }
            }

            await page.screenshot({
              path: `${outputDir}/${name}.png`,
              fullPage: true
            });

            const localAssetFailures = failedRequests.filter(item =>
              item.url.startsWith('http://127.0.0.1:4173/spoodle-space-pp5/static/')
            );

            const result = {
              name,
              status: response ? response.status() : null,
              metrics,
              pageErrors,
              consoleErrors,
              failedRequests,
              localAssetFailures
            };
            results.push(result);

            if (!response || response.status() >= 400) {
              browserErrors.push(`${name}: initial document did not return a successful status`);
            }
            if (metrics.rootChildCount === 0 || metrics.bodyTextLength < 20) {
              browserErrors.push(`${name}: React rendered no meaningful page content`);
            }
            if (!metrics.logoVisible) {
              browserErrors.push(`${name}: SpoodleSpace logo is not visibly rendered`);
            }
            if (metrics.horizontalOverflow > 4) {
              browserErrors.push(`${name}: horizontal overflow is ${metrics.horizontalOverflow}px`);
            }
            if (pageErrors.length) {
              browserErrors.push(`${name}: ${pageErrors.length} unhandled page error(s)`);
            }
            if (localAssetFailures.length) {
              browserErrors.push(`${name}: ${localAssetFailures.length} local static asset request(s) failed`);
            }

            await page.close();
          }

          (async () => {
            const browser = await chromium.launch({ headless: true });
            await verifyViewport(browser, 'desktop', { width: 1440, height: 1000 });
            await verifyViewport(browser, 'mobile', { width: 390, height: 844 });
            await browser.close();
            const safariEngine = await webkit.launch({ headless: true });
            await verifyViewport(safariEngine, 'webkit-mobile', { width: 390, height: 844 });
            await safariEngine.close();

            fs.writeFileSync(
              `${outputDir}/verification-report.json`,
              JSON.stringify({ baseUrl, results, browserErrors }, null, 2)
            );

            console.log(JSON.stringify({ results, browserErrors }, null, 2));
            if (browserErrors.length) process.exit(1);
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          EOF
          NODE_PATH="$GITHUB_WORKSPACE/node_modules" node /tmp/verify-spoodlespace.js

      - name: Upload screenshots and verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spoodlespace-runtime-verification
          path: verification-artifacts
          if-no-files-found: warn
          retention-days: 14
