name: Diagnose authentication routing and branding

on:
  issues:
    types: [opened, reopened]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  diagnose:
    if: github.actor == github.repository_owner && (github.event_name == 'workflow_dispatch' || github.event.issue.title == '[auth-brand-check] Diagnose sign-in routing and logo')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/2018-2020-ui-refresh
          persist-credentials: false
      - name: Collect public source and original logo
        run: |
          mkdir -p diagnostic
          git rev-parse HEAD > diagnostic/source-commit.txt
          tar -czf diagnostic/frontend-source.tar.gz src public scripts package.json package-lock.json server.js
          python -m pip install --quiet Pillow
          python - <<'PY'
          from PIL import Image
          from collections import Counter
          import json
          im = Image.open('src/assets/logo2-spoodlespace.png').convert('RGBA')
          report = {'size': im.size, 'corners': [im.getpixel(p) for p in [(0,0),(im.width-1,0),(0,im.height-1),(im.width-1,im.height-1)]], 'common_pixels': Counter(im.getdata()).most_common(8)}
          open('diagnostic/logo-colours.json', 'w').write(json.dumps(report, indent=2))
          print(json.dumps(report))
          PY
      - name: Probe public pages and empty login validation without credentials
        run: |
          python - <<'PY'
          import json, urllib.request, urllib.error, concurrent.futures
          targets = [
            ('GET', 'https://samobrienolinger.github.io/spoodle-space-pp5/'),
            ('POST', 'https://samobrienolinger.github.io/api/dj-rest-auth/login/'),
            ('GET', 'https://spoodle-space-pp5.herokuapp.com/'),
            ('POST', 'https://spoodle-space-pp5.herokuapp.com/api/dj-rest-auth/login/'),
            ('GET', 'https://spoodlespace.herokuapp.com/'),
            ('POST', 'https://spoodlespace.herokuapp.com/dj-rest-auth/login/'),
          ]
          def probe(target):
              method, url = target
              item = {'method': method, 'url': url}
              request = urllib.request.Request(url, data=b'{}' if method == 'POST' else None, method=method, headers={'Accept': 'application/json, text/html', 'Content-Type': 'application/json', 'User-Agent': 'SpoodleSpace-Auth-Diagnostic'})
              try:
                  try:
                      response = urllib.request.urlopen(request, timeout=35)
                  except urllib.error.HTTPError as error:
                      response = error
                  with response:
                      text = response.read(2048).decode('utf-8', errors='replace')
                      item.update(status=response.status, final_url=response.geturl(), content_type=response.headers.get('Content-Type'), response_excerpt=text[:400])
              except Exception as error:
                  item['network_error'] = str(error)
              return item
          results = list(concurrent.futures.ThreadPoolExecutor(max_workers=6).map(probe, targets))
          open('diagnostic/live-routing.json', 'w').write(json.dumps(results, indent=2))
          print(json.dumps(results, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: spoodlespace-auth-brand-diagnostic
          path: diagnostic
          retention-days: 7
      - name: Report diagnostic run
        if: always() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$REPOSITORY" --body "Authentication routing/brand diagnostic finished. No user credentials were supplied and no user data was changed. Run: https://github.com/$REPOSITORY/actions/runs/$RUN_ID . Artifact: spoodlespace-auth-brand-diagnostic"
