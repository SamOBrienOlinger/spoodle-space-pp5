name: On-demand frontend runtime verification

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: read
  issues: write

jobs:
  verify:
    if: startsWith(github.event.issue.title, '[verify-ui]')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out latest redesign branch
        uses: actions/checkout@v4
        with:
          ref: design/2018-2020-ui-refresh

      - name: Use the declared Node version
        uses: actions/setup-node@v4
        with:
          node-version: 16.20.0
          cache: npm

      - name: Prepare verification output
        run: mkdir -p verification-artifacts

      - name: Install locked dependencies
        id: install
        continue-on-error: true
        run: npm ci 2>&1 | tee verification-artifacts/npm-ci.log

      - name: Run full production npm build
        id: build
        if: steps.install.outcome == 'success'
        continue-on-error: true
        env:
          PUBLIC_URL: /spoodle-space-pp5
          CI: true
        run: npm run build 2>&1 | tee verification-artifacts/npm-build.log

      - name: Install Playwright browser tooling
        id: browser_setup
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.40.1 2>&1 | tee verification-artifacts/playwright-install.log
          npx playwright install --with-deps chromium 2>&1 | tee -a verification-artifacts/playwright-install.log

      - name: Start production build and run visual checks
        id: visual
        if: steps.browser_setup.outcome == 'success'
        continue-on-error: true
        run: |
          mkdir -p preview-root/spoodle-space-pp5
          cp -a build/. preview-root/spoodle-space-pp5/
          npx serve -s preview-root -l 4173 > verification-artifacts/server.log 2>&1 &
          SERVER_PID=$!
          echo "$SERVER_PID" > verification-artifacts/server.pid

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/spoodle-space-pp5/ > /dev/null; then
              break
            fi
            sleep 1
          done

          cat > /tmp/verify-spoodlespace.js <<'EOF'
          const { chromium } = require('playwright');
          const fs = require('fs');

          const baseUrl = 'http://127.0.0.1:4173/spoodle-space-pp5/';
          const outputDir = 'verification-artifacts';
          const results = [];
          const failures = [];
          const unsupportedLabels = [
            'Calendar', 'Events', 'Marketplace', 'Stories',
            'Live Video', 'Messages', 'Notifications'
          ];

          const avatarSvg = encodeURIComponent(`
            <svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240">
              <rect width="240" height="240" rx="36" fill="#f1e9fd"/>
              <circle cx="120" cy="115" r="68" fill="#d9aa72"/>
              <circle cx="93" cy="101" r="8" fill="#24212b"/>
              <circle cx="147" cy="101" r="8" fill="#24212b"/>
              <ellipse cx="120" cy="126" rx="15" ry="11" fill="#24212b"/>
              <path d="M96 148 Q120 168 144 148" fill="none" stroke="#24212b" stroke-width="8" stroke-linecap="round"/>
              <path d="M61 78 Q35 108 63 137" fill="#b77b45"/>
              <path d="M179 78 Q205 108 177 137" fill="#b77b45"/>
            </svg>`);
          const dogImage = `data:image/svg+xml,${avatarSvg}`;

          const currentUser = {
            pk: 1,
            username: 'sam',
            email: 'sam@example.com',
            first_name: 'Sam',
            last_name: "O'Brien-Olinger",
            profile_id: 1,
            profile_image: dogImage
          };

          const profiles = {
            count: 3,
            next: null,
            previous: null,
            results: [
              { id: 2, owner: 'aoife', image: dogImage, following_id: null, posts_count: 4, followers_count: 12, following_count: 5 },
              { id: 3, owner: 'liam', image: dogImage, following_id: null, posts_count: 7, followers_count: 9, following_count: 3 },
              { id: 4, owner: 'conor', image: dogImage, following_id: 8, posts_count: 2, followers_count: 6, following_count: 7 }
            ]
          };

          const posts = {
            count: 2,
            next: null,
            previous: null,
            results: [
              {
                id: 11,
                owner: 'aoife',
                is_owner: false,
                profile_id: 2,
                profile_image: dogImage,
                created_at: '4 Sep 2026',
                updated_at: '2 hours ago',
                title: 'Sunday strolls',
                content: 'A sunny walk by the lake with Luna.',
                image: dogImage,
                image_filter: 'normal',
                like_id: null,
                comments_count: 4,
                likes_count: 29
              },
              {
                id: 12,
                owner: 'liam',
                is_owner: false,
                profile_id: 3,
                profile_image: dogImage,
                created_at: '4 Sep 2026',
                updated_at: '5 hours ago',
                title: 'Training progress',
                content: 'Riley is getting very good at stay.',
                image: dogImage,
                image_filter: 'normal',
                like_id: null,
                comments_count: 2,
                likes_count: 18
              }
            ]
          };

          async function installApiMocks(page) {
            await page.route('**/api/**', async route => {
              const pathname = new URL(route.request().url()).pathname;
              let body;
              let status = 200;

              if (pathname.endsWith('/api/dj-rest-auth/user/')) body = currentUser;
              else if (pathname.includes('/api/profiles/')) body = profiles;
              else if (pathname.includes('/api/posts/')) body = posts;
              else if (pathname.includes('/api/dogprofiles/')) body = { count: 0, next: null, previous: null, results: [] };
              else if (pathname.includes('/api/doghealth/')) body = { count: 0, next: null, previous: null, results: [] };
              else if (pathname.includes('/api/dogdangers/')) body = { count: 0, next: null, previous: null, results: [] };
              else {
                status = 404;
                body = { detail: 'Mock endpoint not configured' };
              }

              await route.fulfill({
                status,
                contentType: 'application/json',
                body: JSON.stringify(body)
              });
            });
          }

          async function verifyViewport(browser, name, viewport) {
            const page = await browser.newPage({ viewportSize: viewport });
            const pageErrors = [];
            const consoleErrors = [];
            const failedRequests = [];

            page.on('pageerror', error => pageErrors.push(error.message));
            page.on('console', message => {
              if (message.type() === 'error') consoleErrors.push(message.text());
            });
            page.on('requestfailed', request => failedRequests.push({
              url: request.url(),
              error: request.failure()?.errorText || 'unknown failure'
            }));

            await installApiMocks(page);
            const response = await page.goto(baseUrl, {
              waitUntil: 'domcontentloaded',
              timeout: 60000
            });
            await page.waitForTimeout(4500);

            const metrics = await page.evaluate(labels => {
              const root = document.getElementById('root');
              const logo = document.querySelector('img[alt="SpoodleSpace"]');
              const text = document.body.innerText;
              return {
                title: document.title,
                bodyTextLength: text.trim().length,
                bodyTextPreview: text.trim().slice(0, 800),
                rootChildCount: root ? root.childElementCount : 0,
                logoVisible: Boolean(logo && logo.getBoundingClientRect().width > 0),
                horizontalOverflow: document.documentElement.scrollWidth - window.innerWidth,
                unsupportedLabelsFound: labels.filter(label => text.includes(label)),
                hasCreatePost: text.includes('Create Post') || text.includes('Post'),
                hasHealth: text.includes('Health'),
                hasSafety: text.includes('Safety'),
                hasLiked: text.includes('Liked'),
                hasSearch: text.includes('Search posts by owner or title')
              };
            }, unsupportedLabels);

            if (name === 'mobile') {
              const toggle = page.locator('.navbar-toggler');
              if (await toggle.count()) {
                await toggle.click();
                await page.waitForTimeout(600);
                await page.screenshot({ path: `${outputDir}/mobile-menu.png`, fullPage: true });
              } else {
                failures.push('mobile: navigation toggle was not rendered');
              }
            }

            await page.screenshot({ path: `${outputDir}/${name}.png`, fullPage: true });

            if (!response || response.status() >= 400) failures.push(`${name}: document response was not successful`);
            if (!metrics.logoVisible) failures.push(`${name}: original SpoodleSpace logo is not visible`);
            if (metrics.rootChildCount === 0 || metrics.bodyTextLength < 40) failures.push(`${name}: React rendered no meaningful content`);
            if (metrics.horizontalOverflow > 4) failures.push(`${name}: horizontal overflow is ${metrics.horizontalOverflow}px`);
            if (metrics.unsupportedLabelsFound.length) failures.push(`${name}: unsupported UI labels found: ${metrics.unsupportedLabelsFound.join(', ')}`);
            if (!metrics.hasHealth || !metrics.hasSafety || !metrics.hasLiked) failures.push(`${name}: one or more supported feature links are missing`);
            if (name === 'desktop' && !metrics.hasSearch) failures.push('desktop: accurate post search label is missing');
            if (pageErrors.length) failures.push(`${name}: ${pageErrors.length} unhandled page error(s)`);

            results.push({ name, status: response?.status() || null, metrics, pageErrors, consoleErrors, failedRequests });
            await page.close();
          }

          (async () => {
            const browser = await chromium.launch({ headless: true });
            await verifyViewport(browser, 'desktop', { width: 1440, height: 1000 });
            await verifyViewport(browser, 'mobile', { width: 390, height: 844 });
            await browser.close();

            const report = { baseUrl, results, failures };
            fs.writeFileSync(`${outputDir}/verification-report.json`, JSON.stringify(report, null, 2));
            console.log(JSON.stringify(report, null, 2));
            if (failures.length) process.exit(1);
          })().catch(error => {
            fs.writeFileSync(`${outputDir}/fatal-error.txt`, String(error.stack || error));
            console.error(error);
            process.exit(1);
          });
          EOF

          node /tmp/verify-spoodlespace.js 2>&1 | tee verification-artifacts/visual-verification.log

      - name: Upload build logs, report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spoodlespace-full-verification
          path: verification-artifacts
          if-no-files-found: warn
          retention-days: 14

      - name: Report result to this issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          BROWSER_SETUP_OUTCOME: ${{ steps.browser_setup.outcome }}
          VISUAL_OUTCOME: ${{ steps.visual.outcome }}
          RUN_ID: ${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          cat > /tmp/result.md <<EOF
          ## SpoodleSpace verification result

          - Branch: \`design/2018-2020-ui-refresh\`
          - Node: \`16.20.0\`
          - \`npm ci\`: **${INSTALL_OUTCOME}**
          - \`npm run build\`: **${BUILD_OUTCOME}**
          - Browser tooling: **${BROWSER_SETUP_OUTCOME}**
          - Desktop/mobile visual verification: **${VISUAL_OUTCOME}**
          - Workflow run ID: \`${RUN_ID}\`
          - Artifact: \`spoodlespace-full-verification\`

          Run: https://github.com/${REPOSITORY}/actions/runs/${RUN_ID}
          EOF
          gh issue comment "$ISSUE_NUMBER" --body-file /tmp/result.md

      - name: Fail workflow when verification failed
        if: always()
        env:
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          BROWSER_SETUP_OUTCOME: ${{ steps.browser_setup.outcome }}
          VISUAL_OUTCOME: ${{ steps.visual.outcome }}
        run: |
          test "$INSTALL_OUTCOME" = "success"
          test "$BUILD_OUTCOME" = "success"
          test "$BROWSER_SETUP_OUTCOME" = "success"
          test "$VISUAL_OUTCOME" = "success"
