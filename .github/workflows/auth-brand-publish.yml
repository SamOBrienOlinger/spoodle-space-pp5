name: Verify historical auth and branding
on:
  issues:
    types: [opened, reopened]
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: historical-auth-brand-verification
  cancel-in-progress: false
jobs:
  verify:
    if: github.actor == github.repository_owner && (github.event_name == 'workflow_dispatch' || github.event.issue.title == '[publish-auth-brand] Verify and publish preview fix')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/2018-2020-ui-refresh
          persist-credentials: false
      - name: Record tested source
        id: source
        shell: bash
        run: |
          mkdir -p verification-artifacts
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git rev-parse HEAD > verification-artifacts/source-commit.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 16.20.0
          cache: npm
      - name: Locked dependency install and full production build
        shell: bash
        env:
          CI: true
          PUBLIC_URL: /spoodle-space-pp5
        run: |
          set -euo pipefail
          npm ci 2>&1 | tee verification-artifacts/npm-ci.log
          npm run build 2>&1 | tee verification-artifacts/npm-build.log
      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install isolated browser tooling
        run: npm install --prefix /tmp/spoodle-browser --no-save --package-lock=false playwright-core@1.51.1
      - name: Test real compiled frontend with fixtures and live empty-request probes
        shell: bash
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          NODE_PATH: /tmp/spoodle-browser/node_modules
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          node scripts/serve-preview.cjs > verification-artifacts/server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/spoodle-space-pp5/ > /dev/null; then break; fi
            sleep 1
          done
          node scripts/verify-auth-brand.cjs 2>&1 | tee verification-artifacts/auth-brand.log
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spoodlespace-auth-brand-verification
          path: verification-artifacts
          retention-days: 14
      - name: Report actual run status
        if: always() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RESULT: ${{ job.status }}
          TESTED_SHA: ${{ steps.source.outputs.sha }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$REPOSITORY" --body "Historical auth and branding verification finished with status $RESULT. Source $TESTED_SHA. Run https://github.com/$REPOSITORY/actions/runs/$RUN_ID ."
