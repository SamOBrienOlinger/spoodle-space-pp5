<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 597 780" width="597" height="780" role="img" aria-labelledby="erd-title erd-desc"><title id="erd-title">SpoodleSpace API data used by the frontend</title><desc id="erd-desc">Profiles link to their posts and comments in the feed. A profile response can also point to dog profile, health and behaviour records.</desc><metadata data-format="mermaid">erDiagram
    accTitle: SpoodleSpace API data used by the frontend
    accDescr: Profiles link to their posts and comments in the feed. A profile response can also point to dog profile, health and behaviour records.
    Post }o..|| Profile : "authored by"
    Comment }o..|| Profile : "authored by"
    Post ||..o{ Comment : receives
    Profile ||..o| "Dog Profile" : "links to"
    Profile ||..o| "Dog Health" : "links to"
    Profile ||..o| "Dog Danger" : "links to"

    Profile {
        number id
        number dog_profile "Optional ID"
        number dog_health "Optional ID"
        number dog_danger "Optional ID"
    }
    Post {
        number id
        number profile_id
        string title
    }
    Comment {
        number id
        number post
        number profile_id
    }</metadata><style>:root {
  --panel:#f7fafc; --border:#c7d8e4; --heading:#14354b; --accent:#128276;
  --card:#174b62; --card-title:#fff; --text:#183448; --muted:#486278;
  --row:#fff; --stripe:#edf5f9; --rule:#9ab7c9; --line:#486980;
  --label-bg:#e2f3ee; --label-text:#195649;
}
@media (prefers-color-scheme:dark) {
  :root {
    --panel:#101c2a; --border:#3c566c; --heading:#eaf5fe; --accent:#53c7b2;
    --card:#25526b; --card-title:#fff; --text:#e0edf6; --muted:#b4cadd;
    --row:#192b3c; --stripe:#1e3448; --rule:#52738a; --line:#a3becf;
    --label-bg:#1b3c41; --label-text:#c3f4e8;
  }
}
text { font-family:Arial, Helvetica, sans-serif; }
.panel { fill:var(--panel); stroke:var(--border); }
.accent { fill:var(--accent); }
.graphic-title { fill:var(--heading); font-weight:700; font-size:16px; }
.entityBox { fill:var(--card); stroke:var(--rule); }
.entity-heading { fill:var(--card-title); font-size:16px; font-weight:700; text-anchor:middle; dominant-baseline:middle; }
.attributeBoxOdd { fill:var(--row); stroke:var(--rule); stroke-width:.8; }
.attributeBoxEven { fill:var(--stripe); stroke:var(--rule); stroke-width:.8; }
.attribute-text { fill:var(--text); font-size:13.6px; dominant-baseline:middle; }
.attribute-type, .attribute-comment { fill:var(--muted); }
.attribute-key { fill:var(--label-text); font-weight:700; }
.relationshipLine { fill:none; stroke:var(--line); stroke-width:1.25; }
.relationshipLabel { fill:var(--label-text); font-size:14px; font-weight:600; text-anchor:middle; dominant-baseline:middle; }
.relationshipLabelBox { fill:var(--label-bg); }
marker path { stroke:var(--line); fill:none; }
